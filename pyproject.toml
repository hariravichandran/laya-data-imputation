[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-impute"
version = "0.1.0"
description = "Categorical data imputation with a fine-tuned Laya checkpoint"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["laya==0.4.13", "pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["laya_impute"]
